services:
  postgres:
    image: postgres:16
    container_name: paperflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paperflow
    ports:
      - "5432:5432"
    volumes:
      - paperflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paperflow-postgres-data:
